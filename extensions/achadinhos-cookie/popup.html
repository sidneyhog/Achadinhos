<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Copiar cookie</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; color: #0f172a; }
    h1 { margin: 0 0 4px; font-size: 16px; }
    p { margin: 0 0 12px; color: #64748b; font-size: 13px; }
    button { width: 100%; height: 40px; border: 0; border-radius: 10px; background: #6d28d9; color: #fff; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    a { display: block; margin-top: 10px; color: #6d28d9; font-size: 13px; }
    #status { margin-top: 12px; font-size: 13px; }
    #status.ok { color: #15803d; }
    #status.erro { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Mercado Livre</h1>
  <p>Entre na sua conta do Mercado Livre neste navegador e clique abaixo. Depois cole no painel em Lojas → Mercado Livre → Cookie do gerador.</p>
  <button id="copiar" type="button">Copiar cookie</button>
  <div id="status" role="status"></div>
  <a href="https://www.mercadolivre.com.br/afiliados/linkbuilder" target="_blank" rel="noopener">Abrir o gerador de links do ML</a>
  <script src="popup.js"></script>
</body>
</html>
